<!DOCTYPE html>
<html>
<head>
    <title>3D Scene Loading</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }
        #warning {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }
        .warning-box {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid #ff0000;
            box-shadow: 0 0 50px rgba(255,0,0,0.5);
            animation: pulse 1s infinite;
        }
        .warning-box h1 {
            color: #ff0000;
            font-size: 32px;
            margin-bottom: 20px;
        }
        .warning-box p {
            color: #ffffff;
            margin-bottom: 30px;
            font-size: 16px;
        }
        .warning-box button {
            background: #ff0000;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .warning-box button:hover {
            transform: scale(1.05);
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 50px rgba(255,0,0,0.3); }
            100% { box-shadow: 0 0 100px rgba(255,0,0,0.8); }
        }
        #loading {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            z-index: 100000;
            display: none;
        }
    </style>
</head>
<body>
<div id="warning">
    <div class="warning-box">
        <h1>INFORMATION</h1>
        <p>This website was created by Rion Valderron.</p>
        <button id="okBtn">OK</button>
    </div>
</div>
<div id="loading">Loading 3D Scene... (Inisialisasi)</div>

<script>
    document.getElementById('okBtn').addEventListener('click', function() {
        document.getElementById('warning').style.display = 'none';
        document.getElementById('loading').style.display = 'block';
        
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
        script.onload = function() {
            start3DOverload();
        };
        document.head.appendChild(script);
    });
    
    function start3DOverload() {
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 15);
        camera.lookAt(0, 0, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);
        
        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);
        
        const lights = [];
        for(let i = 0; i < 500; i++) {
            const light = new THREE.PointLight(0xff0000, 1, 20);
            light.position.set(Math.random() * 20 - 10, Math.random() * 10, Math.random() * 20 - 10);
            scene.add(light);
            lights.push(light);
        }
        
        const canvas = document.createElement('canvas');
        canvas.width = 1024;
        canvas.height = 1024;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ff0000';
        ctx.fillRect(0, 0, 1024, 1024);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'Bold 50px Arial';
        ctx.fillText('RANSOM', 400, 512);
        const texture = new THREE.CanvasTexture(canvas);
        
        const materials = [
            new THREE.MeshStandardMaterial({ color: 0xff0000, metalness: 0.8, roughness: 0.2 }),
            new THREE.MeshStandardMaterial({ color: 0x00ff00, metalness: 0.8, roughness: 0.2 }),
            new THREE.MeshStandardMaterial({ color: 0x0000ff, metalness: 0.8, roughness: 0.2 }),
            new THREE.MeshStandardMaterial({ color: 0xffff00, metalness: 0.8, roughness: 0.2 }),
            new THREE.MeshStandardMaterial({ color: 0xff00ff, metalness: 0.8, roughness: 0.2 }),
            new THREE.MeshStandardMaterial({ map: texture, metalness: 0.9, roughness: 0.1 })
        ];
        
        const spheres = [];
        for(let i = 0; i < 5000; i++) {
            const geometry = new THREE.SphereGeometry(0.3 + Math.random() * 0.5, 64, 64);
            const material = materials[Math.floor(Math.random() * materials.length)];
            const sphere = new THREE.Mesh(geometry, material);
            sphere.position.x = (Math.random() - 0.5) * 30;
            sphere.position.y = (Math.random() - 0.5) * 15;
            sphere.position.z = (Math.random() - 0.5) * 30;
            sphere.userData = {
                speedX: (Math.random() - 0.5) * 0.05,
                speedY: (Math.random() - 0.5) * 0.05,
                speedZ: (Math.random() - 0.5) * 0.05,
                rotSpeed: Math.random() * 0.03
            };
            scene.add(sphere);
            spheres.push(sphere);
        }
        
        const cubes = [];
        for(let i = 0; i < 5000; i++) {
            const geometry = new THREE.BoxGeometry(0.4, 0.4, 0.4);
            const material = materials[Math.floor(Math.random() * materials.length)];
            const cube = new THREE.Mesh(geometry, material);
            cube.position.x = (Math.random() - 0.5) * 30;
            cube.position.y = (Math.random() - 0.5) * 15;
            cube.position.z = (Math.random() - 0.5) * 30;
            cube.userData = {
                speedX: (Math.random() - 0.5) * 0.05,
                speedY: (Math.random() - 0.5) * 0.05,
                speedZ: (Math.random() - 0.5) * 0.05,
                rotSpeed: Math.random() * 0.03
            };
            scene.add(cube);
            cubes.push(cube);
        }
        
        const toruses = [];
        for(let i = 0; i < 2000; i++) {
            const geometry = new THREE.TorusGeometry(0.5, 0.15, 64, 128);
            const material = materials[Math.floor(Math.random() * materials.length)];
            const torus = new THREE.Mesh(geometry, material);
            torus.position.x = (Math.random() - 0.5) * 30;
            torus.position.y = (Math.random() - 0.5) * 15;
            torus.position.z = (Math.random() - 0.5) * 30;
            torus.userData = {
                speedX: (Math.random() - 0.5) * 0.05,
                speedY: (Math.random() - 0.5) * 0.05,
                speedZ: (Math.random() - 0.5) * 0.05,
                rotSpeed: Math.random() * 0.03
            };
            scene.add(torus);
            toruses.push(torus);
        }
        
          icos = [];
        for(let i = 0; i < 3000; i++) {
            const geometry = new THREE.IcosahedronGeometry(0.35, 0);
            const material = materials[Math.floor(Math.random() * materials.length)];
            const ico = new THREE.Mesh(geometry, material);
            ico.position.x = (Math.random() - 0.5) * 30;
            ico.position.y = (Math.random() - 0.5) * 15;
            ico.position.z = (Math.random() - 0.5) * 30;
            ico.userData = {
                speedX: (Math.random() - 0.5) * 0.05,
                speedY: (Math.random() - 0.5) * 0.05,
                speedZ: (Math.random() - 0.5) * 0.05,
                rotSpeed: Math.random() * 0.03
            };
            scene.add(ico);
            icos.push(ico);
        }
        
        const particleCount = 200000;
        const particlesGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        for(let i = 0; i < particleCount; i++) {
            particlePositions[i*3] = (Math.random() - 0.5) * 50;
            particlePositions[i*3+1] = (Math.random() - 0.5) * 30;
            particlePositions[i*3+2] = (Math.random() - 0.5) * 50;
        }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particleMaterial = new THREE.PointsMaterial({ color: 0xff0000, size: 0.1 });
        const particles = new THREE.Points(particlesGeometry, particleMaterial);
        scene.add(particles);
        
        const gridHelper = new THREE.GridHelper(50, 100, 0xff0000, 0x00ff00);
        scene.add(gridHelper);
        
        const axesHelper = new THREE.AxesHelper(10);
        scene.add(axesHelper);
        
        let frameCount = 0;
        let lastTime = performance.now();
        let fps = 0;
        
        let startTime = Date.now();
        let lagDuration = 600000;
        
        function animate() {
            frameCount++;
            const now = performance.now();
            if(now - lastTime >= 1000) {
                fps = frameCount;
                frameCount = 0;
                lastTime = now;
                document.getElementById('loading').innerHTML = `3D Scene Active | Objects: ${spheres.length + cubes.length + toruses.length + icos.length + particleCount} | FPS: ${fps} | Lag tersisa: ${Math.max(0, Math.ceil((lagDuration - (Date.now() - startTime))/1000))} detik`;
            }
            
            lights.forEach((light, idx) => {
                light.position.x += Math.sin(Date.now() * 0.002 + idx) * 0.05;
                light.position.y += Math.cos(Date.now() * 0.003 + idx) * 0.05;
                light.intensity = 0.8 + Math.sin(Date.now() * 0.004 + idx) * 0.5;
            });
            
            spheres.forEach(sphere => {
                sphere.position.x += sphere.userData.speedX;
                sphere.position.y += sphere.userData.speedY;
                sphere.position.z += sphere.userData.speedZ;
                sphere.rotation.x += sphere.userData.rotSpeed;
                sphere.rotation.y += sphere.userData.rotSpeed;
                
                if(Math.abs(sphere.position.x) > 20) sphere.userData.speedX *= -1;
                if(Math.abs(sphere.position.y) > 12) sphere.userData.speedY *= -1;
                if(Math.abs(sphere.position.z) > 20) sphere.userData.speedZ *= -1;
            });
            
            cubes.forEach(cube => {
                cube.position.x += cube.userData.speedX;
                cube.position.y += cube.userData.speedY;
                cube.position.z += cube.userData.speedZ;
                cube.rotation.x += cube.userData.rotSpeed;
                cube.rotation.y += cube.userData.rotSpeed;
                cube.rotation.z += cube.userData.rotSpeed;
                
                if(Math.abs(cube.position.x) > 20) cube.userData.speedX *= -1;
                if(Math.abs(cube.position.y) > 12) cube.userData.speedY *= -1;
                if(Math.abs(cube.position.z) > 20) cube.userData.speedZ *= -1;
            });
            
            toruses.forEach(torus => {
                torus.position.x += torus.userData.speedX;
                torus.position.y += torus.userData.speedY;
                torus.position.z += torus.userData.speedZ;
                torus.rotation.x += torus.userData.rotSpeed;
                torus.rotation.y += torus.userData.rotSpeed;
                torus.rotation.z += torus.userData.rotSpeed;
                
                if(Math.abs(torus.position.x) > 20) torus.userData.speedX *= -1;
                if(Math.abs(torus.position.y) > 12) torus.userData.speedY *= -1;
                if(Math.abs(torus.position.z) > 20) torus.userData.speedZ *= -1;
            });
            
            icos.forEach(ico => {
                ico.position.x += ico.userData.speedX;
                ico.position.y += ico.userData.speedY;
                ico.position.z += ico.userData.speedZ;
                ico.rotation.x += ico.userData.rotSpeed;
                ico.rotation.y += ico.userData.rotSpeed;
                ico.rotation.z += ico.userData.rotSpeed;
                
                if(Math.abs(ico.position.x) > 20) ico.userData.speedX *= -1;
                if(Math.abs(ico.position.y) > 12) ico.userData.speedY *= -1;
                if(Math.abs(ico.position.z) > 20) ico.userData.speedZ *= -1;
            });
            
            particles.rotation.y += 0.005;
            particles.rotation.x += 0.003;
            
            camera.position.x = Math.sin(Date.now() * 0.0005) * 2;
            camera.position.y = 5 + Math.sin(Date.now() * 0.0003) * 1;
            camera.lookAt(0, 0, 0);
            
            renderer.render(scene, camera);
            
            if(Date.now() - startTime < lagDuration) {
                requestAnimationFrame(animate);
            } else {
                renderer.dispose();
                document.body.removeChild(renderer.domElement);
                document.getElementById('loading').style.display = 'none';
                
                const finishMsg = document.createElement('div');
                finishMsg.style.position = 'fixed';
                finishMsg.style.top = '50%';
                finishMsg.style.left = '50%';
                finishMsg.style.transform = 'translate(-50%, -50%)';
                finishMsg.style.backgroundColor = 'rgba(0,0,0,0.9)';
                finishMsg.style.color = '#00ff00';
                finishMsg.style.padding = '30px';
                finishMsg.style.borderRadius = '10px';
                finishMsg.style.fontFamily = 'monospace';
                finishMsg.style.textAlign = 'center';
                finishMsg.style.zIndex = '100000';
                finishMsg.style.border = '2px solid #00ff00';
                finishMsg.innerHTML = '<h1>✅ PEMINDAIAN SELESAI ✅</h1><p>Sistem Anda berhasil dioptimalkan.</p><p>Tidak ditemukan ancaman serius.</p><button onclick="this.parentElement.remove()" style="background:#00ff00;color:black;border:none;padding:10px 20px;margin-top:20px;cursor:pointer">TUTUP</button>';
                document.body.appendChild(finishMsg);
            }
        }
        
        animate();
    }
</script>
</body>
</html>
